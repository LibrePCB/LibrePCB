# LibrePCB RPC API specification (single source of truth)
#
# This file describes the RPC API of the LibrePCB RPC server, i.e. the
# classes (with their methods), the involved data types and the error
# types. The wire protocol (msgpack, framing, envelope, handshake) is
# specified in dev/plans/rpc-server.md and documented in
# dev/doxygen/pages/rpc_server.md (protocol) and
# dev/doxygen/pages/rpc_api.md (generated API reference).
#
# Top-level keys:
# - `format`: The format of this yml file itself, as "MAJOR.MINOR" (only
#   bumped when the file structure changes in a way which requires
#   consumers like dev/rpc/gen.py to be adapted).
# - `protocol`: The version of the wire protocol which this file describes,
#   as a monotonic integer (see the negotiation rules in
#   dev/doxygen/pages/rpc_server.md).
#
# Consumers:
# - The documentation generator (dev/rpc/gen.py).
# - Client authors: Read this file to know which methods exist, and compare
#   each method's `since` with the `version` reported by the
#   server's `authenticate` method to know which ones are available on a
#   given server (functions added after the revision of your spec file are
#   unknown to you, which is fine — calling them results in error -32601).
#
# Schema notes:
# - Types are from the protocol's value domain: null, bool, int (i64 or
#   u64),
#   float (f64), string, binary, array, map (with string keys). A struct is
#   a map with the listed fields. `handle` is a special type: an *opaque*
#   object handle (see the class descriptions). No msgpack extension
#   types are used — everything is expressed with builtin types only
#   (e.g. UUIDs are passed as 36-character strings).
# - The params of every method are a map. The reserved key "obj" carries
#   the receiver handle for non-static methods — it is NOT listed in the
#   params below. Handles are opaque values: Clients obtain them from
#   responses (embedded under the reserved "obj" key) and must pass them
#   back unchanged, without making any assumptions about their type or
#   value. The representation may change from command to command and from
#   app version to app version.
# - Numeric conventions: Lengths are in nanometers (i64), angles in
#   microdegrees (i64), if not stated otherwise.

format: "0.1"
protocol: 1

# ---------------------------------------------------------------------------
# Errors
# ---------------------------------------------------------------------------

errors:
  # Transport errors

  - code: 10
    name: InvalidMessage
    message: Message decoding failed
    description: >-
      The received message could not be decoded (invalid MessagePack or a
      truncated value), so the stream framing is broken and the connection
      is closed without a response.

  - code: 11
    name: MessageTooLarge
    message: Message too large
    description: >-
      The received message exceeded the maximum size of 32 MiB, so the
      connection is closed without a response.

  # Protocol errors

  - code: 20
    name: InvalidRequest
    message: Invalid request
    description: >-
      The request doesn't conform to the message envelope.

  # Command dispatching errors

  - code: 30
    name: Unauthenticated
    message: Connection is not authenticated
    description: >-
      A request other than `initialize` or `authenticate` was sent on a
      connection which is not authenticated yet.

  - code: 31
    name: MethodNotFound
    message: Method not found
    description: >-
      The method was not found, e.g. because it was added in a newer
      application version than the running one, or the method has been removed
      from the application and is no longer available.

  #- code: 32
  #  name: MethodNotAvailable
  #  message: Method not available
  #  description: >-
  #    The method exists, but is currently not available. This may be the case
  #    if the application is in a state where the requested functionality does
  #    not exist.

  - code: 33
    name: AccessDenied
    message: Access denied
    description: >-
      The authentication failed, e.g. because the provided proof or
      token was invalid, or an interactive connection request was denied
      by the user.

  - code: 39
    name: InternalError
    message: Internal error
    description: >-
      An unexpected internal error occurred, e.g. a command handler
      returned invalid data. This is a bug in LibrePCB, please open an issue
      on GitHub.

  # Command parsing errors

  - code: 40
    name: InvalidArgs
    message: Invalid method arguments
    description: >-
      The method arguments are invalid, e.g. wrong value types, missing required
      arguments, invalid values, or unknown enum values.

  - code: 41
    name: InvalidHandle
    message: Invalid object handle
    description: >-
      The provided object handle is invalid or has expired (e.g. object was
      deleted in the mean time). For example, this error is returned when
      accessing a project after it has been closed.

  # Generic command execution errors

  - code: 50
    name: UnexpectedState
    message: Unexpected state
    description: >-
      The command is not valid for the current state of the application. Check
      which preconditions need to be met for executing this command.

  - code: 99
    name: Cancelled
    message: Request cancelled
    description: >-
      The request was cancelled by the client and the command stopped its
      work when it could. Note that if the work already completed, the
      normal result is sent instead (exactly one response per request).

  # Application-specific command execution errors

  - code: 100
    name: CommandFailed
    message: Command failed
    description: >-
      The command execution failed in an unspecified way, i.e. none of the
      specific error codes fit. The message contains details about the failure.

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enums:
  - name: AttributeType
    values:
      - name: string
      - name: resistance
      - name: capacitance
      - name: inductance
      - name: voltage
      - name: current
      - name: power
      - name: frequency
  - name: BackupRestoreMode
    values:
      - name: abort
        description: >-
          Do not attempt to open a file which has an auto-save backup. Abort
          with an error instead.
      - name: discard
        description: >-
          Discard the backup, restore and load the last saved state.
      - name: restore
        description: >-
          Restore the auto-save backup, if available.

# ---------------------------------------------------------------------------
# Structs
# ---------------------------------------------------------------------------

structs:
  - name: Attribute
    description: An attribute.
    fields:
      - name: name
        type: string
        description: Attribute name (key).
      - name: type
        type: AttributeType
        description: Type of the attribute.
      - name: value
        type: string
        description: >-
          Value of the attribute. If type is not string, the value has to be
          a valid number, otherwise it will be rejected.
      - name: unit
        type: AttributeUnit
        description: TODO

  - name: ProjectEditorSummary
    description: A summary of an open project.
    fields:
      - name: obj
        type: handle
        description: The opaque handle of the project (to be passed back in the "obj" key of requests targeting this project).
      - name: uuid
        type: string
        description: The project UUID (null if the project file contains an invalid UUID).
      - name: name
        type: string
        description: The project name.
      - name: author
        type: string
        description: The project author.
      - name: version
        type: string
        description: The project version.
      - name: path
        type: string
        description: >-
          The file path of the project file. If the project is located within
          the workspace projects folder, a relative path is returned, otherwise
          an absolute path.
      - name: dirty
        type: bool
        description: >-
          Whether the project has unsaved changes (i.e. its undo stack is not
          clean, or any manual, untracked changes have been made).

  - name: ProjectEditorDetails
    description: Details about an open project.
    fields:
      - name: uuid
        type: string
        description: The project UUID.
      - name: name
        type: string
        description: The project name.
      - name: author
        type: string
        description: The project author.
      - name: version
        type: string
        description: The project version.
      - name: path
        type: string
        description: The absolute path of the project file.
      - name: dirty
        type: bool
        description: Whether the project has unsaved changes (i.e. its undo stack is not clean).
      - name: sheets
        type: array
        items: SchematicSummary
        description: All schematic sheets of the project.
      - name: boards
        type: array
        items: BoardSummary
        description: All boards of the project.

  - name: SchematicSummary
    description: A summary of a schematic sheet.
    fields:
      - name: uuid
        type: string
        description: The schematic UUID.
      - name: name
        type: string
        description: The schematic name.

  - name: BoardSummary
    description: A summary of a board.
    fields:
      - name: uuid
        type: string
        description: The board UUID.
      - name: name
        type: string
        description: The board name.

  - name: RemoteLibrarySummary
    description: A summary of a remote library.
    fields:
      - name: uuid
        type: string
        description: The remote library UUID.
      - name: name
        type: string
        description: The remote library name.
      - name: description
        type: string
        description: The remote library description.
      - name: installed_version
        type: string?
        description: The installed version, if the library is installed.
      - name: online_version
        type: string?
        description: The latest available version, if known.

  - name: RuleCheckMessage
    description: An electrical rule check (ERC) message.
    fields:
      - name: obj
        type: handle
        description: >-
          The object handle of the message (a hash of its approval), to be
          passed in the "obj"-like parameters of the `set` method.
      - name: severity
        type: ErcSeverity
        description: The severity of the message.
      - name: message
        type: string
        description: The human-readable message.
      - name: description
        type: string?
        description: >-
          An optional, more detailed description of the message, if
          available.
      - name: approved
        type: bool
        description: Whether the message is currently approved.

  - name: UndoStackDetails
    description: The state of a document's undo stack.
    fields:
      - name: id
        type: any
        description: >-
          An opaque identifier which uniquely identifies the current state.
          This can be used for example to detect if there were any changes made
          between two different points in time.
      - name: clean
        type: bool
        description: >-
          Whether the stack is in the clean state (the state of the last save).
      - name: prev
        type: string?
        description: >-
          The text of the previously executed command, i.e. the command which
          will be reverted by `undo()`. If there is no command to undo, this is
          `nil`.
      - name: next
        type: string?
        description: >-
          The text of the previously undone command, i.e. the command which
          will be executed by `redo()`. If there is no command to redo, this is
          `nil`.

  - name: WorkspaceDetails
    description: Information about a workspace.
    fields:
      - name: path
        type: string
        description: Absolute file path to the workspace.
      - name: projects_path
        type: string
        description: >-
          Absolute file path to the projects root directory in the workspace.

  - name: WorkspaceDbDetails
    description: Information about the workspace library database.
    fields: []

# ---------------------------------------------------------------------------
# Classes and their methods
# ---------------------------------------------------------------------------

classes:
  # The protocol-level methods are not part of any class, so the class
  # name is null. The generator generates them as the pseudo class
  # "ProtocolRpc".
  - name: null
    description: >-
      Protocol-level methods, which are not assigned to any other class.
    since: "2.2.0"
    methods:
      - name: initialize
        static: true
        description: >-
          Handshake and version negotiation. The first message of a
          connection must be this request, and its structure never changes
          (see the transport protocol documentation). It does not
          authenticate the connection — call `authenticate` afterwards.
        params:
          - name: protocol
            type: int
            description: >-
              The highest protocol version supported by the client, as a
              non-negative integer (see the transport protocol
              documentation for the negotiation rules).
        result:
          - name: protocol
            type: int
            description: The negotiated protocol version of this connection.
          - name: nonce
            type: string
            description: >-
              A fresh random challenge for this connection, to be signed
              in the `proof` argument of the subsequent `authenticate`
              request.

      - name: authenticate
        static: true
        description: >-
          Authenticate the connection. Must be called after `initialize`,
          before any other request. Two mechanisms are planned: External
          clients prove possession of an Ed25519 private key whose public
          key the user has confirmed in the application (unknown keys are
          confirmed interactively, known keys are accepted silently), and
          processes spawned by the application itself simply pass the token
          they received out-of-band (e.g. by an environment variable). The
          spawned-process mechanism is not implemented yet, i.e. the token
          argument is currently always rejected.
        params:
          - name: name
            type: string
            description: An arbitrary name identifying the client application.
          - name: pubkey
            type: string?
            description: >-
              The Ed25519 public key of an external client, as 64 hex
              characters. If provided, `proof` must contain the signature
              of the `nonce` from the `initialize` response (64 bytes,
              hex encoded).
          - name: proof
            type: string?
            description: >-
              The Ed25519 signature (128 hex characters) over the `nonce`,
              proving possession of the private key belonging to `pubkey`.
          - name: token
            type: string?
            description: >-
              The token received out-of-band from the application which
              spawned this process. Only valid for the lifetime of the
              spawning application instance. Not implemented yet: The
              argument is currently always rejected.
        result:
          - name: server
            type: string
            description: Always "librepcb", so clients can verify the server.
          - name: version
            type: string
            description: The application version.
          - name: session
            type: string
            description: >-
              A UUID identifying the running application process (changes
              on every application restart).

      - name: ping
        static: true
        description: >-
          A request which is answered with a nil result by the server
          itself, without any further processing. Useful to test a
          client connection.
        params: []

  - name: ProjectEditor
    description: A project opened in the application.
    since: "2.2.0"
    methods:
      - name: list
        description: List all open projects.
        static: true
        params: []
        result:
          - name: projects
            type: array
            items: ProjectEditorSummary
            description: All open projects, in the order of their editor tabs.

      - name: create
        description: Create a new project and open it.
        static: true
        params:
          - name: path
            type: string
            description: >-
              Absolute *.lpp file path. Its directory must not exist yet or
              must be empty.
          - name: name
            type: string?
            description: >-
              If provided, the project's name will be set. Otherwise, the
              file basename will be used as project name.
          - name: license
            type: string?
            description: >-
              SPDX license identifier of the license to set on the project.
              Note that only a small set of licenses are supported. If
              omitted, no `LICENSE.txt` will be added to the project.
        result: ProjectEditorSummary

      - name: open
        description: >-
          Open a project by file path. If the project is already open,
          nothing is changed and the summary of the already open project
          is returned.
        static: true
        params:
          - name: path
            type: string
            description: The absolute path of the project file (*.lpp or *.lppz).
          - name: backup
            type: BackupRestoreMode
            default: abort
            description: >-
              If the project directory contains an auto-save backup (i.e. the
              application crashed while the project was open and had unsaved
              modifications), this flag specifies how to proceed in that case.
        result: ProjectEditorSummary

      - name: get
        description: Get details about an open project.
        params: []
        result: ProjectEditorDetails

      - name: set
        description: Set project metadata and settings.
        params:
          - name: name
            type: string
            description: Project name.
          - name: author
            type: string
            description: Project author.
          - name: version
            type: string
            description: Project version.
          - name: attributes
            type: array
            items: Attribute
            description: Project attributes.
          - name: locale_order
            type: array
            items: string
            description: Locale order.
          - name: norm_order
            type: array
            items: string
            description: Norm order.
        result: ProjectEditorDetails

      - name: save
        description: Save project to disk.
        params: []
        result: []

      - name: close
        description: >-
          Close project. Attention: If there were unsaved changes in the
          project, they will be discarded. Call `save` first, if desired.
        params: []
        result: []

  - name: RuleCheck
    description: >-
      Various kinds of rule checks - library checks, electrical rule check
      (ERC), and design rule check (DRC).
    since: "2.2.0"
    methods:
      - name: run
        description: >-
          Runs the check and return all emitted messages, together with
          their approved state.
        params:
          - name: quick
            type: bool
            default: false
            description: >-
              Run only the most important checks, not the complete suite of
              checks. This is much faster than the full check, but will
              return only a partial result. This flag is only supported for
              the DRC, not for the other checks.
        result:
          - name: messages
            type: array
            items: RuleCheckMessage

      - name: set
        description: >-
          Set the approved state of multiple messages (bulk setter).
          The handles of a previous `run()` call are only valid as long as
          the ERC messages did not change.
        params:
          - name: messages
            type: array
            items: handle
            description: The object handles of the messages to modify.
          - name: approved
            type: bool
            description: The approved state to set on all given messages.

  - name: GraphicsExport
    description: Provides access to 2D renderings.
    since: "2.2.0"
    methods:
      - name: run
        description: >-
          Run a graphics export of a complete schematic, a single sheet, or
          a board.
        params:
          - name: path
            type: string
            description: >-
              Absolute destination file path. If not provided, the file(s) will
              be returned as binary blobs in the response.
          - name: format
            type: string
            default: png
            description: >-
              Image format. Only respected if `path` is absent, If `path` is
              given, the format will be auto-detected from its file extension.
          - name: dpi
            type: integer
            default: 300
            description: Resolution.
          #- name: region
          #  type: array
          #  items: Point
          #  description: >-
          #    Region to render (top_left/bottom_right). If omitted, the whole
          #    scene is rendered.
          - name: flip
            type: bool
            default: false
            description: >-
              If true, the rendering will be flipped to the bottom side. Only
              supported for boards.
          #- name: layers
          #  type: map
          #  items: map
          #  description: >-
          #    Layers to render. Map key is the layer ID, value may contain
          #    'color' to specify the color. If omitted, default values will
          #    be used.
          - name: realistic
            type: bool
            default: false
            description: >-
              If true, a realistic rendering will be done. Only supported for
              boards.
          - name: background
            type: string
            default: "#00000000"
            description: Hex RGB(A) background color.
        result:
          - name: paths
            type: array
            items: string
            description: >-
              Absolute file paths to the written output files. Only provided
              if a `path` was passed.
          - name: files
            type: array
            items: binary
            description: >-
              Output files (image or PDF) in the requested format as binary
              blobs. Only provided if `path` was not passed.
          #- name: regions
          #  type: array
          #  items: Rect2D
          #  description: >-
          #    Region represented by the image (coordinates of pixels at [0,0]
          #    and [N,N]).
          - name: errors
            type: array
            items: string
            description: >-
              Any occurred rendering errors if the image could be rendered
              partially. If the image could not be rendered at all, an RPC
              error is returned instead.

  - name: Workspace
    description: Access to the currently opened workspace.
    since: "2.2.0"
    methods:
      - name: get
        description: Get information about the workspace.
        static: true
        params: []
        result: WorkspaceDetails

  - name: UndoStack
    description: >-
      The undo stack of an open document. The handle may point to a project or
      a library element.
    since: "2.2.0"
    methods:
      - name: get
        description: Get the state of the undo stack.
        params: []
        result: UndoStackDetails

      - name: undo
        description: >-
          Undo the last command, then return the new state. If there is nothing
          to undo, the command fails with an error.
        params: []
        result: UndoStackDetails

      - name: redo
        description: >-
          Redo the last undone the last command, then return the new state.
          If there is nothing to redo, the command fails with an error.
        params: []
        result: UndoStackDetails

  - name: RemoteLibrary
    description: Allows to list, install, update and uninstall remote libraries.
    since: "2.2.0"
    methods:
      - name: list
        description: >-
          Fetch all remote libraries. If the application already has the list
          ready, this method immediately returns all of them at once. If the
          list needs to be fetched from the configured servers first, this
          method streams the libraries in notifications.
        static: true
        params: []
        result:
          - name: libraries
            type: array
            items: RemoteLibrarySummary
            description: >-
              All remote libraries, in an unspecified (but stable) order.

      - name: apply
        description: >-
          Install/update or uninstall remote libraries in one batch. Note that
          dependent libraries will automatically be installed/updated or
          uninstalled too. This behavior may change in future releases.

          IMPORTANT: After calling this method, use `WorkspaceDb.wait()` to
          wait for the library changes to appear in the database!
        static: true
        params:
          - name: install
            type: array
            items: uuid
            description: UUID of libraries to install.
          - name: uninstall
            type: array
            items: uuid
            description: UUID of libraries to uninstall.
        result: []

      - name: get
        description: Get details about a remote library.
        params: []
        result: RemoteLibraryDetails

  - name: WorkspaceDb
    description: >-
      The library database of the currently opened workspace.

      IMPORTANT: After the app startup, and after each modification of the
      local or remote libraries (install/remove/create/edit), call `wait()`
      before accessing the database again. Otherwise, the database may not
      reflect the changes yet, i.e. returns outdated information.
    since: "2.2.0"
    methods:
      - name: wait
        description: >-
          Wait for the library rescan to complete. If the database is already
          up-to-date, this method returns immediately. If a scan is currently
          in progress or scheduled, the method blocks until the scan finished.
          During the scan, progress notifications will be emitted.
        static: true
        params: []
        result: WorkspaceDbDetails

      - name: search
        description: Search library elements.
        static: true
        params:
          - name: type
            type: LibraryElementType
            description: Type of library elements to find.
          - name: query
            type: string
            description: >-
              Keyword to search for. If omitted or empty, all elements will
              be returned.
          - name: library
            type: string
            description: >-
              If provided, only list elements contained in this library,
              specified by its absolute file path.
          - name: category
            type: string?
            description: >-
              If provided, only list elements or categories within this
              category. If `null`, it means the root category, or elements
              without a valid category.
          - name: package
            type: string
            description: >-
              If provided, only list devices or parts for this package.
          - name: component
            type: string
            description: >-
              If provided, only list devices or parts for this component.
          - name: device
            type: string
            description: >-
              If provided, only list parts for this device.
          - name: limit
            type: int
            description: Max. number of results to return.
        result:
          - name: matches
            type: array
            items: WorkspaceDbSearchResult
            description: Search results.

      - name: query_sql
        description: Query the SQLite database directly (read-only).
        static: true
        params:
          - name: query
            type: string
            description: SQL query.
        result:
          - name: rows
            type: array
            items: map
            description: Result rows.

      - name: get
        description: >-
          Get details about a specific library element. This accesses not
          only the database, but also loads the library element from disk.
          So this is a more heavy operation and may take a few milliseconds
          up to maybe a second. The data will be cached - any further call
          on the same library element will be responded from memory, as long
          as no library rescan was started in the mean time (rescan invalidates
          the cache).
        static: true
        params:
          - name: type
            type: string
            description: >-
              Type of library element to open ("library", "component_category",
              "package_category", "symbol", "package", "component", "device",
              "organization").
          - name: path
            type: string
            description: >-
              File path to the library elements directory, relative to the
              workspace libraries root folder. If omitted, the `uuid` argument
              must be passed instead.
          - name: uuid
            type: string
            description: >-
              UUID of the library element. If there exist multiple library
              elements with that UUID, the one with the highest version number
              will be returned. If omitted, the `path` argument must be passed
              instead.
        result: [] # TODO - depends on requested library element type
