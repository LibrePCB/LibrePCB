# LibrePCB RPC API specification (single source of truth)
#
# This file describes the RPC API of the LibrePCB RPC server, i.e. the
# classes (with their methods), the involved data types and the error
# types. The wire protocol (msgpack, framing, envelope, handshake) is
# specified in dev/plans/rpc-server.md and documented in
# dev/doxygen/pages/rpc_server.md (protocol) and
# dev/doxygen/pages/rpc_api.md (generated API reference).
#
# Consumers:
# - The documentation generator (dev/rpc/gen.py).
# - Client authors: Read this file to know which methods exist, and compare
#   each method's `since` with the `version` reported by the
#   server's `initialize` method to know which ones are available on a
#   given server (functions added after the revision of your spec file are
#   unknown to you, which is fine — calling them results in error -32601).
#
# Schema notes:
# - Types are from the protocol's value domain: null, bool, int (i64 or
#   u64),
#   float (f64), string, binary, array, map (with string keys), ext (see
#   the extension types below). A struct is a map with the listed
#   fields. `handle` is a special type: an *opaque* object handle (see
#   the class descriptions). `uuid` is an extension type, `uuid_str` the
#   same UUID as a 36-character string.
# - The params of every method are a map. The reserved key "obj" carries
#   the receiver handle for non-static methods — it is NOT listed in the
#   params below. Handles are opaque values: Clients obtain them from
#   responses (embedded under the reserved "obj" key) and must pass them
#   back unchanged, without making any assumptions about their type or
#   value. The representation may change from command to command and from
#   app version to app version.
# - Numeric conventions: Lengths are in nanometers (i64), angles in
#   microdegrees (i64), if not stated otherwise.

format: "1.0"
protocol: "1.0"

# ---------------------------------------------------------------------------
# Errors
# ---------------------------------------------------------------------------

errors:
  # Transport errors

  - code: 10
    name: InvalidMessage
    message: Message decoding failed
    description: >-
      The received message could not be decoded (invalid MessagePack or a
      truncated value), so the stream framing is broken and the connection
      is closed without a response.

  - code: 11
    name: MessageTooLarge
    message: Message too large
    description: >-
      The received message exceeded the maximum size of 32 MiB, so the
      connection is closed without a response.

  # Protocol errors

  - code: 20
    name: InvalidRequest
    message: Invalid request
    description: >-
      The request doesn't conform to the message envelope.

  # Command dispatching errors

  - code: 30
    name: Unauthenticated
    message: Connection is not authenticated
    description: >-
      A request other than `initialize` was sent on a connection which is
      not authenticated yet. The first message of a connection must be an
      `initialize` request.

  - code: 31
    name: MethodNotFound
    message: Method not found
    description: >-
      The method was not found, e.g. because it was added in a newer
      application version than the running one, or the method has been removed
      from the application and is no longer available.

  #- code: 32
  #  name: MethodNotAvailable
  #  message: Method not available
  #  description: >-
  #    The method exists, but is currently not available. This may be the case
  #    if the application is in a state where the requested functionality does
  #    not exist.

  - code: 33
    name: AccessDenied
    message: Access denied
    description: >-
      The provided access token doesn't have the permissions to execute the
      command. If this error is returned by the 'initialize' method, it means
      that either the provided token is invalid or has expired, or an
      interactive connection request was denied by the user.

  - code: 39
    name: InternalError
    message: Internal error
    description: >-
      An unexpected internal error occurred, e.g. a command handler
      returned invalid data. This is a bug in LibrePCB, please open an issue
      on GitHub.

  # Command parsing errors

  - code: 40
    name: InvalidArgs
    message: Invalid method arguments
    description: >-
      The method arguments are invalid, e.g. wrong value types, missing required
      arguments, invalid values, or unknown enum values.

  - code: 41
    name: InvalidHandle
    message: Invalid object handle
    description: >-
      The provided object handle is invalid or has expired (e.g. object was
      deleted in the mean time). For example, this error is returned when
      accessing a project after it has been closed.

  # Generic command execution errors

  - code: 50
    name: UnexpectedState
    message: Unexpected state
    description: >-
      The command is not valid for the current state of the application. Check
      which preconditions need to be met for executing this command.

  - code: 99
    name: Cancelled
    message: Request cancelled
    description: >-
      The request was cancelled by the client and the command stopped its
      work when it could. Note that if the work already completed, the
      normal result is sent instead (exactly one response per request).

  # Application-specific command execution errors

  - code: 100
    name: CommandFailed
    message: Command failed
    description: >-
      The command execution failed in an unspecified way, i.e. none of the
      specific error codes fit. The message contains details about the failure.

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enums:
  - name: BackupRestoreMode
    default: abort
    values:
      - name: abort
        description: >-
          Do not attempt to open a file which has an auto-save backup. Abort
          with an error instead.
      - name: discard
        description: >-
          Discard the backup, restore and load the last saved state.
      - name: restore
        description: >-
          Restore the auto-save backup, if available.

# ---------------------------------------------------------------------------
# Extension Types
# ---------------------------------------------------------------------------
#
# The MessagePack extension types used by this API, i.e. tagged raw bytes.
# They are opaque to the transport layer: Only the ext code and the raw
# payload cross the wire, their interpretation is up to the client/server.

ext_types:
  - name: uuid
    code: "0x02"
    description: >-
      A UUID (RFC 4122), encoded as its 16 bytes in field order (network
      byte order). This is equivalent to the string representation
      (type "uuid_str"), but requires only half of the size on the wire.

# ---------------------------------------------------------------------------
# Structs
# ---------------------------------------------------------------------------

structs:
  - name: ProjectEditorSummary
    description: A summary of an open project.
    fields:
      - name: obj
        type: handle
        description: The opaque handle of the project (to be passed back in the "obj" key of requests targeting this project).
      - name: uuid
        type: string
        description: The project UUID (null if the project file contains an invalid UUID).
      - name: name
        type: string
        description: The project name.
      - name: author
        type: string
        description: The project author.
      - name: version
        type: string
        description: The project version.
      - name: path
        type: string
        description: The absolute path of the project file.
      - name: dirty
        type: bool
        description: >-
          Whether the project has unsaved changes (i.e. its undo stack is not
          clean, or any manual, untracked changes have been made).

  - name: ProjectEditorDetails
    description: Details about an open project.
    fields:
      - name: uuid
        type: uuid
        description: The project UUID.
      - name: name
        type: string
        description: The project name.
      - name: author
        type: string
        description: The project author.
      - name: version
        type: string
        description: The project version.
      - name: path
        type: string
        description: The absolute path of the project file.
      - name: dirty
        type: bool
        description: Whether the project has unsaved changes (i.e. its undo stack is not clean).
      - name: sheets
        type: array
        items: SchematicSummary
        description: All schematic sheets of the project.
      - name: boards
        type: array
        items: BoardSummary
        description: All boards of the project.

  - name: SchematicSummary
    description: A summary of a schematic sheet.
    fields:
      - name: uuid
        type: uuid
        description: The schematic UUID.
      - name: name
        type: string
        description: The schematic name.

  - name: BoardSummary
    description: A summary of a board.
    fields:
      - name: uuid
        type: uuid
        description: The board UUID.
      - name: name
        type: string
        description: The board name.

  - name: UndoStackDetails
    description: The state of a document's undo stack.
    fields:
      - name: id
        type: any
        description: >-
          An opaque identifier which uniquely identifies the current state.
          This can be used for example to detect if there were any changes made
          between two different points in time.
      - name: clean
        type: bool
        description: >-
          Whether the stack is in the clean state (the state of the last save).
      - name: prev
        type: string?
        description: >-
          The text of the previously executed command, i.e. the command which
          will be reverted by `undo()`. If there is no command to undo, this is
          `nil`.
      - name: next
        type: string?
        description: >-
          The text of the previously undone command, i.e. the command which
          will be executed by `redo()`. If there is no command to redo, this is
          `nil`.

  - name: WorkspaceDbDetails
    description: Information about the workspace library database.
    fields: []

# ---------------------------------------------------------------------------
# Classes and their methods
# ---------------------------------------------------------------------------

classes:
  # The protocol-level methods are not part of any class, so the class
  # name is null. The generator generates them as the pseudo class
  # "ProtocolRpc".
  - name: null
    description: >-
      Protocol-level methods, which are not assigned to any other class.
    since: "2.2.0"
    methods:
      - name: initialize
        static: true
        description: >-
          Handshake and authentication. The first message of a connection
          must be this request (see the transport protocol documentation).
        params:
          - name: name
            type: string
            description: An arbitrary name identifying the client application.
          - name: token
            type: string
            description: >-
              A token previously received by an initialize call of this
              application instance. If not provided (or nil), the
              connection request has to be confirmed by the user in the
              application.
        result:
          - name: format
            type: string
            description: The handshake format version, currently always "1.0".
          - name: server
            type: string
            description: Always "librepcb", so clients can verify the server.
          - name: version
            type: string
            description: The application version.
          - name: session
            type: string
            description: >-
              A UUID identifying the running application process (changes
              on every application restart).
          - name: workspace
            type: string
            description: The absolute path of the currently opened workspace.
          - name: token
            type: string
            description: >-
              The token to be used for subsequent connections of this
              client (see the transport protocol documentation).

      - name: ping
        static: true
        description: >-
          A request which is answered with a nil result by the server
          itself, without any further processing. Useful to test a
          client connection.
        params: []

  - name: ProjectEditor
    description: A project opened in the application.
    since: "2.2.0"
    methods:
      - name: list
        description: List all open projects.
        static: true
        params: []
        result:
          - name: projects
            type: array
            items: ProjectEditorSummary
            description: All open projects, in the order of their editor tabs.

      - name: open
        description: >-
          Open a project by file path. If the project is already open,
          nothing is changed and the summary of the already open project
          is returned.
        static: true
        params:
          - name: path
            type: string
            description: The absolute path of the project file (*.lpp or *.lppz).
          - name: backup
            type: BackupRestoreMode
            default: abort
            description: >-
              If the project directory contains an auto-save backup (i.e. the
              application crashed while the project was open and had unsaved
              modifications), this flag specifies how to proceed in that case.
        result: ProjectEditorSummary

      - name: get
        description: Get details about an open project.
        params: []
        result: ProjectEditorDetails

      - name: save
        description: Save project to disk.
        params: []
        result: []

      - name: close
        description: >-
          Close project. Attention: If there were unsaved changes in the
          project, they will be discarded. Call `save` first, if desired.
        params: []
        result: []

  - name: UndoStack
    description: >-
      The undo stack of an open document. The handle may point to a project or
      a library element.
    since: "2.2.0"
    methods:
      - name: get
        description: Get the state of the undo stack.
        params: []
        result: UndoStackDetails

      - name: undo
        description: >-
          Undo the last command, then return the new state. If there is nothing
          to undo, the command fails with an error.
        params: []
        result: UndoStackDetails

      - name: redo
        description: >-
          Redo the last undone the last command, then return the new state.
          If there is nothing to redo, the command fails with an error.
        params: []
        result: UndoStackDetails

  - name: RemoteLibrary
    description: Allows to list, install, update and uninstall remote libraries.
    methods:
      - name: list
        description: >-
          Fetch all remote libraries. If the application already has the list
          ready, this method immediately returns all of them at once. If the
          list needs to be fetched from the configured servers first, this
          method streams the libraries in notifications.
        static: true
        params: []
        result:
          - name: libraries
            type: array
            items: RemoteLibrarySummary
            description: >-
              All remote libraries, in an unspecified (but stable) order.

      - name: install
        description: >-
          Install or update remote libraries in one batch. Note that dependent
          libraries will automatically be installed/updated too.
        params:
          - name: libraries
            type: array
            items: uuid_str
            description: UUID of libraries to install.

      - name: uninstall
        description: >-
          Uninstall remote libraries in one batch. Note that dependent
          libraries will automatically be uninstalled too.

          ATTENTION: Be careful with uninstalling libraries which are currently
          not available in any online repository, since this may lead to data
          loss which cannot be undone!
        params:
          - name: libraries
            type: array
            items: uuid_str
            description: UUID of libraries to uninstall.

      - name: get
        description: Get details about a remote library.
        params: []
        result: RemoteLibraryDetails

  - name: WorkspaceDb
    description: >-
      The library database of the currently opened workspace.

      IMPORTANT: After the app startup, and after each modification of the
      local or remote libraries (install/remove/create/edit), call `wait()`
      before accessing the database again. Otherwise, the database may not
      reflect the changes yet, i.e. returns outdated information.
    methods:
      - name: wait
        description: >-
          Wait for the library rescan to complete. If the database is already
          up-to-date, this method returns immediately. If a scan is currently
          in progress or scheduled, the method blocks until the scan finished.
          During the scan, progress notifications will be emitted.
        static: true
        params: []
        result: WorkspaceDbDetails
